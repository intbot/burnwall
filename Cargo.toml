[package]
name = "burnwall"
version = "0.8.0"
edition = "2021"
description = "Local proxy for AI coding tools (Claude Code, Codex CLI, Aider): cache-aware cost tracking, path/command security checks, daily budget enforcement. Zero telemetry."
# FSL-1.1-MIT is not an SPDX identifier; crates.io rejects it as `license`,
# so the license is declared via the file instead.
license-file = "LICENSE"
repository = "https://github.com/intbot/burnwall"
homepage = "https://github.com/intbot/burnwall"
authors = ["intbot"]
readme = "README.md"
keywords = ["ai", "llm", "security", "proxy", "cost-tracking"]
categories = ["command-line-utilities", "network-programming"]

[package.metadata.wix]
upgrade-guid = "B31E1E35-DA87-471E-8FC3-B9D26926B9A4"
path-guid = "1B65F07B-49F5-469A-AF2C-8C091A57035A"
license = false
eula = false

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP proxy
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1", "http2"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

# HTTP client for forwarding
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }

# CLI
clap = { version = "4", features = ["derive"] }
clap_complete = "4"                  # Shell completion script generator

# JSON parsing
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Config
toml = "0.8"
serde_norway = "0.9"                 # YAML for per-project .burnwall.yaml profiles

# SQLite
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Utilities
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"                           # Cross-platform home directory
regex = "1"                          # Pattern matching for security rules
dashmap = "6"                        # Concurrent hashmap for loop detection
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"                 # Stream adapters for SSE response pass-through
sha2 = "0.10"                        # SHA-256 content pin for third-party rule-pack trust (TOFU)
ed25519-dalek = { version = "2", features = ["rand_core"] }  # Signed audit receipts (v0.8)
rand_core = { version = "0.6", features = ["getrandom"] }    # OsRng for audit keypair generation

# Process control for daemon mode + `burnwall stop`
[target.'cfg(unix)'.dependencies]
libc = "0.2"                         # kill(2) for liveness checks and SIGTERM

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }

[dev-dependencies]
# Testing
tokio-test = "0.4"
tempfile = "3"
wiremock = "0.6"                     # Mock HTTP server for integration tests
assert_cmd = "2"                     # CLI testing
predicates = "3"                     # Assertion helpers

[[test]]
name = "proxy_test"
path = "tests/integration/proxy_test.rs"

[[test]]
name = "parser_test"
path = "tests/unit/parser_test.rs"

[[test]]
name = "pricing_test"
path = "tests/unit/pricing_test.rs"

[[test]]
name = "storage_test"
path = "tests/unit/storage_test.rs"

[[test]]
name = "security_test"
path = "tests/integration/security_test.rs"

[[test]]
name = "budget_test"
path = "tests/integration/budget_test.rs"

[[test]]
name = "pipeline_test"
path = "tests/integration/pipeline_test.rs"

[[test]]
name = "config_test"
path = "tests/unit/config_test.rs"

[[test]]
name = "project_profile_test"
path = "tests/unit/project_profile_test.rs"

[[test]]
name = "logscrape_test"
path = "tests/unit/logscrape_test.rs"

[[test]]
name = "cli_test"
path = "tests/integration/cli_test.rs"

[[test]]
name = "init_test"
path = "tests/integration/init_test.rs"

[[test]]
name = "daemon_test"
path = "tests/integration/daemon_test.rs"

[[test]]
name = "cache_injection_test"
path = "tests/unit/cache_injection_test.rs"

[[test]]
name = "mcp_watch_test"
path = "tests/integration/mcp_watch_test.rs"

[[test]]
name = "mcp_firewall_test"
path = "tests/unit/mcp_firewall_test.rs"

[[test]]
name = "mcp_routing_test"
path = "tests/unit/mcp_routing_test.rs"

[[test]]
name = "mcp_cli_test"
path = "tests/integration/mcp_cli_test.rs"

[[test]]
name = "dlp_test"
path = "tests/unit/dlp_test.rs"

[[test]]
name = "rulepack_test"
path = "tests/unit/rulepack_test.rs"

[[test]]
name = "rules_test"
path = "tests/integration/rules_test.rs"

[[test]]
name = "waste_test"
path = "tests/unit/waste_test.rs"

[[test]]
name = "observe_test"
path = "tests/unit/observe_test.rs"

[[test]]
name = "audit_cli_test"
path = "tests/integration/audit_cli_test.rs"

[profile.release]
opt-level = "z"                      # Optimize for size
lto = true                          # Link-time optimization
codegen-units = 1                    # Single codegen unit for better optimization
strip = true                         # Strip debug symbols

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
