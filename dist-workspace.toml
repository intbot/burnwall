[workspace]
members = ["cargo:."]

# Config for 'dist'
#
# dist is the single orchestrator: on a `v*` tag it builds every target ONCE,
# uploads the binaries to a GitHub Release (the single source of truth), then
# fans them out to every storefront. Built-in legs (shell/powershell/homebrew/
# npm/msi installers + homebrew/npm publish) are generated by dist; the
# crates.io, NuGet, and PyPI legs are custom reusable workflows referenced
# below with the "./name" syntax. None of them rebuild the binary.
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
#   shell/powershell -> the curl | sh and irm | iex one-liners
#   homebrew         -> a formula published to the tap below
#   npm              -> an npm package using the esbuild optionalDependencies layout
#   msi              -> a native Windows installer
installers = ["shell", "powershell", "homebrew", "npm", "msi"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Where the Homebrew formula is published (a GitHub repo named homebrew-*).
# Requires a HOMEBREW_TAP_TOKEN secret (PAT, repo scope) on THIS repo.
tap = "intbot/homebrew-tap"
# Publish fan-out. Built-ins ("homebrew", "npm") publish to their registries;
# the "./publish-*" entries are the custom reusable workflows in .github/workflows/.
# The custom legs self-skip (green, no-op) when their API token secret is absent,
# so they are safe to ship dormant until the keys are added at v0.9.
publish-jobs = ["homebrew", "npm", "./publish-crates", "./publish-nuget", "./publish-pypi"]
# Run a plan-only check on PRs (don't try to build/publish on every PR).
pr-run-mode = "plan"
