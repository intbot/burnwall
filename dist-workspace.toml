[workspace]
members = ["cargo:."]

# Config for 'dist'
#
# dist is the single orchestrator: on a `v*` tag it builds every target ONCE,
# uploads the binaries to a GitHub Release (the single source of truth), then
# fans them out to every storefront. Built-in legs (shell/powershell/homebrew/
# npm/msi installers + homebrew/npm publish) are generated by dist; the
# crates.io, NuGet, and PyPI legs are custom reusable workflows referenced
# below with the "./name" syntax. None of them rebuild the binary.
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
#   shell/powershell -> the curl | sh and irm | iex one-liners
#   homebrew         -> a formula published to the tap below
#   npm              -> an npm package using the esbuild optionalDependencies layout
#   msi              -> a native Windows installer
installers = ["shell", "powershell", "homebrew", "npm", "msi"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Where the Homebrew formula is published (the existing tap repo).
# Requires a HOMEBREW_TAP_TOKEN secret (PAT, repo scope) on THIS repo.
tap = "intbot/homebrew-burnwall"
# Publish fan-out. Only the custom reusable workflows are wired today; each
# self-skips (green, no-op) when its API token secret is absent, so a tag
# releases cleanly before any credentials exist. The "homebrew"/"npm" built-in
# publish jobs are intentionally NOT listed yet: they hard-fail without their
# secret/tap, which would redden the release and block `announce`. Their
# installers stay enabled above, so the formula + npm package are still built
# and attached to the GitHub Release — just not auto-pushed to the tap/registry.
# At v0.9, add the secrets + tap token, then re-add "homebrew", "npm" here.
publish-jobs = ["./publish-crates", "./publish-nuget", "./publish-pypi"]
# Run a plan-only check on PRs (don't try to build/publish on every PR).
pr-run-mode = "plan"
