name: Team tools

# The self-hosted team tools under team/ (Python API, Cursor extension). The Rust CI in ci.yml doesn't cover them.
on:
  push:
    branches: [main]
    paths: ["team/**", ".github/workflows/team.yml"]
  pull_request:
    branches: [main]
    paths: ["team/**", ".github/workflows/team.yml"]

permissions:
  contents: read

jobs:
  cursor-api:
    name: cursor api (python ${{ matrix.python }})
    strategy:
      matrix:
        python: ["3.10", "3.12"]
      fail-fast: false
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: team/cursor/api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: team/cursor/api/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q

  cursor-extension:
    name: cursor extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: team/cursor/extension
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: team/cursor/extension/package-lock.json
      - run: npm ci
      - run: npx tsc -p . --noEmit
      - run: npm run package   # vsce also checks the README and manifest
